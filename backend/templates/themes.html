{% extends "base.html" %}

{% block title %}プロジェクト | 音声文字起こし{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">プロジェクト</h2>
    <p class="page-subtitle">音声ファイルをまとめる入れ物です。固有名詞や参加者を登録すると、文字起こしの精度が上がります。</p>
</div>

<div id="projects-root" x-data="projectsPage()">

    {# ── アクションバー ── #}
    <div class="projects-action-bar">
        <button class="btn btn-primary" @click="showForm = !showForm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;margin-right:6px;vertical-align:-2px">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            プロジェクトを追加
        </button>
    </div>

    {# ── 追加フォーム ── #}
    <div class="inline-form" x-show="showForm" x-cloak x-transition>
        <h3 class="inline-form-title">プロジェクトを追加</h3>
        <div class="form-row">
            <label class="form-label">プロジェクト名 <span class="required">*</span></label>
            <input type="text" class="form-input" x-model="newProject.name"
                   placeholder="例: ○○社 打ち合わせ"
                   @keydown.enter="createProject()"
                   x-ref="nameInput">
        </div>
        <div class="form-row">
            <label class="form-label">説明 <span class="form-label-hint">任意</span></label>
            <input type="text" class="form-input" x-model="newProject.description"
                   placeholder="例: 2026年度 営業案件">
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" @click="createProject()" :disabled="!newProject.name.trim()">作成</button>
            <button class="btn btn-ghost" @click="showForm = false; newProject = {name:'', description:''}">キャンセル</button>
        </div>
    </div>

    {# ── 空状態 ── #}
    <template x-if="projects.length === 0">
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="empty-state-icon">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <p class="empty-state-text">まだプロジェクトがありません。<br>上のボタンからプロジェクトを追加してください。</p>
        </div>
    </template>

    {# ── プロジェクト一覧 ── #}
    <div class="project-flat-list">
        <template x-for="proj in projects" :key="proj.id">
            <div class="project-flat-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="project-flat-icon">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <a :href="'/projects/' + proj.id" class="project-flat-name" x-text="proj.name"></a>
                <span class="project-flat-count" x-show="proj.transcript_count > 0" x-text="proj.transcript_count + '件'"></span>
                <button class="btn-icon btn-icon-danger" @click="deleteProject(proj)" title="プロジェクトを削除">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                    </svg>
                </button>
            </div>
        </template>
    </div>

</div>

<script>
function projectsPage() {
    return {
        projects: [],
        showForm: false,
        newProject: { name: '', description: '' },

        async init() {
            await this.load();
        },

        async load() {
            try {
                const res = await fetch('/api/projects-list');
                if (res.ok) {
                    this.projects = await res.json();
                }
            } catch (e) {
                window.showToast('データの読み込みに失敗しました', 'error');
            }
        },

        async createProject() {
            const name = this.newProject.name.trim();
            if (!name) return;
            try {
                const res = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description: this.newProject.description || null }),
                });
                if (!res.ok) throw new Error((await res.json()).detail || res.status);
                window.showToast('プロジェクトを作成しました');
                this.showForm = false;
                this.newProject = { name: '', description: '' };
                await this.load();
            } catch (e) {
                window.showToast('作成に失敗しました: ' + e.message, 'error');
            }
        },

        async deleteProject(proj) {
            const ok = await window.showConfirm(
                `「${proj.name}」を削除しますか？\n音声ファイルとのひも付きは解除されますが、ファイル自体は残ります。`,
                { title: 'プロジェクトを削除', okLabel: '削除する' }
            );
            if (!ok) return;
            try {
                const res = await fetch('/api/projects/' + proj.id, { method: 'DELETE' });
                if (!res.ok) throw new Error(res.status);
                window.showToast('プロジェクトを削除しました');
                await this.load();
            } catch (e) {
                window.showToast('削除に失敗しました', 'error');
            }
        },
    };
}
</script>
{% endblock %}
