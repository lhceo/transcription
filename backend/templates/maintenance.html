<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メンテナンス中 | 音声文字起こし</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            background: #f7f8fa;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 24px;
            display: block;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a2e;
        }
        p {
            font-size: 15px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .note {
            font-size: 13px;
            color: #888;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🔧</span>
        <h1>メンテナンス中です</h1>
        <p>現在、システムのメンテナンスを行っています。</p>
        <p>しばらく時間をおいてからアクセスしてください。</p>
        <p class="note">ご不便をおかけして申し訳ございません。<br>メンテナンス完了後、自動的に再開します。</p>
        <p class="note"><a href="/admin" style="color:#6366f1;text-decoration:none;">管理パネルへ →</a></p>
    </div>
</body>
</html>
