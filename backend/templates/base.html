<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}音声文字起こし{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='/img/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.3" defer></script>
</head>
<body>
    {% block header %}
    <header class="app-header">
        <div class="container">
            <a href="/" class="logo" aria-label="ホームへ">
                <img src="{{ url_for('static', path='/img/header.svg') }}" alt="音声文字起こし" class="logo-img">
            </a>
            <nav class="nav">
                {% block nav %}
                {% if user %}
                <a href="/help" class="nav-link nav-link-with-icon">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span>ヘルプ</span>
                </a>
                <div class="user-menu">
                    {% if user.picture %}
                    <img src="{{ user.picture }}" alt="" class="user-avatar" referrerpolicy="no-referrer">
                    {% endif %}
                    <span class="user-name">{{ user.name }}</span>
                    <form method="post" action="/auth/logout" class="logout-form">
                        <button type="submit" class="btn-link">ログアウト</button>
                    </form>
                </div>
                {% endif %}
                {% endblock %}
            </nav>
        </div>
    </header>
    {% endblock %}

    <main class="app-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container">
            <span class="version">v{{ app_version }}{% if env != 'production' %} ({{ env }}){% endif %}</span>
        </div>
    </footer>
</body>
</html>
