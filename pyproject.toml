[project]
name = "transcription-web"
version = "0.2.0"
description = "社内向け音声文字起こし Web アプリ（AssemblyAI 連携）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    # Phase 2: 認証
    "authlib>=1.3.2",        # OAuth クライアント
    "httpx>=0.27.2",         # authlib が内部で使う + テストでも使う
    "itsdangerous>=2.2.0",   # SessionMiddleware が要求する署名ライブラリ
]

[project.optional-dependencies]
# Phase 3 以降で追加していく
# db = ["sqlalchemy>=2.0.36", "alembic>=1.13.3"]
# transcribe = ["assemblyai>=0.34.0"]
dev = [
    "pytest>=8.3.3",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
