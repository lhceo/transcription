<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文字起こしアプリ</title>
<link rel="stylesheet" href="/static/tailwind.css">
<script defer src="/static/alpine.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  [style*="display: none"] { display: none !important; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  .drag-over { border-color: #3B82F6 !important; background: #EFF6FF !important; }
  textarea { resize: none; outline: none; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 select-none overflow-hidden" style="height:100vh;">

<div
  x-data="app()"
  x-init="init()"
  class="flex h-screen"
>
  <!-- ── Narrow icon sidebar ─────────────────────────────── -->
  <nav class="w-14 bg-white border-r border-slate-200 flex flex-col items-center py-4 gap-2 shrink-0 z-10">
    <div class="w-8 h-8 rounded-lg bg-blue-500 flex items-center justify-center mb-4">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
      </svg>
    </div>
    <button @click="tab='transcribe'"
      :class="tab==='transcribe' ? 'bg-slate-100 text-blue-600' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-600'"
      class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors" title="文字起こし">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z"/>
      </svg>
    </button>
    <button @click="tab='settings'"
      :class="tab==='settings' ? 'bg-slate-100 text-blue-600' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-600'"
      class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors" title="設定">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </nav>

  <!-- ── Left panel ───────────────────────────────────────── -->
  <div x-show="tab==='transcribe'" class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-y-auto scrollbar-thin">

    <!-- File upload zone -->
    <div class="p-4 border-b border-slate-100">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">音声ファイル</p>
      <div
        class="border-2 border-dashed border-slate-200 rounded-xl p-5 text-center cursor-pointer transition-colors hover:border-blue-400 hover:bg-blue-50"
        @click="selectFile()"
        @dragover.prevent="$el.classList.add('drag-over')"
        @dragleave="$el.classList.remove('drag-over')"
        @drop.prevent="$el.classList.remove('drag-over'); handleDrop($event)"
      >
        <template x-if="!selectedFile">
          <div>
            <svg class="w-8 h-8 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="text-sm text-slate-500">クリックまたはドロップ</p>
            <p class="text-xs text-slate-400 mt-1">MP3 · MP4 · WAV · M4A など</p>
          </div>
        </template>
        <template x-if="selectedFile">
          <div class="flex items-center gap-2 text-left">
            <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-medium text-slate-700 truncate" x-text="selectedFile.name"></p>
              <p class="text-xs text-blue-500 mt-0.5">クリックで変更</p>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Settings mini -->
    <div class="p-4 border-b border-slate-100">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">設定</p>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-500 mb-1 block">言語</label>
          <select x-model="config.language"
            class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">自動検出</option>
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <label class="flex items-center gap-2.5 cursor-pointer">
          <div class="relative">
            <input type="checkbox" x-model="config.useDiarization" class="sr-only">
            <div :class="config.useDiarization ? 'bg-blue-500' : 'bg-slate-200'" class="w-9 h-5 rounded-full transition-colors"></div>
            <div :class="config.useDiarization ? 'translate-x-4' : 'translate-x-0'" class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform"></div>
          </div>
          <span class="text-sm text-slate-600">話者分離</span>
        </label>
      </div>
    </div>

    <!-- Start button -->
    <div class="p-4 border-b border-slate-100">
      <button
        @click="startTranscription()"
        :disabled="!selectedFile || running"
        :class="(!selectedFile || running) ? 'opacity-40 cursor-not-allowed' : 'hover:bg-blue-600 active:scale-95'"
        class="w-full bg-blue-500 text-white font-semibold text-sm py-2.5 rounded-xl transition-all">
        <span x-show="!running">文字起こし開始</span>
        <span x-show="running" class="flex items-center justify-center gap-2">
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          処理中…
        </span>
      </button>

      <!-- Progress -->
      <div x-show="running || progressMsg" class="mt-3">
        <div class="flex justify-between text-xs text-slate-500 mb-1">
          <span x-text="progressMsg"></span>
          <span x-text="progressPct + '%'"></span>
        </div>
        <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-blue-500 rounded-full transition-all duration-300" :style="'width:' + progressPct + '%'"></div>
        </div>
      </div>

      <!-- Error -->
      <div x-show="errorMsg" class="mt-3 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-xs text-red-600" x-text="errorMsg"></p>
      </div>
    </div>

    <!-- Project buttons -->
    <div class="p-4">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">プロジェクト</p>
      <div class="space-y-2">
        <button @click="saveProject()"
          :disabled="segments.length === 0"
          :class="segments.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'"
          class="w-full text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-2 flex items-center gap-2 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
          </svg>
          プロジェクト保存
        </button>
        <button @click="openProject()"
          class="w-full text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-2 flex items-center gap-2 transition-colors hover:bg-slate-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/>
          </svg>
          プロジェクトを開く
        </button>
      </div>
    </div>
  </div>

  <!-- ── Settings panel ───────────────────────────────────── -->
  <div x-show="tab==='settings'" class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-y-auto scrollbar-thin p-4">
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">詳細設定</p>
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-slate-700 mb-1.5 block">Whisper モデル</label>
        <select x-model="config.model"
          class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="mlx-community/whisper-large-v3-mlx">large-v3 (高精度)</option>
          <option value="mlx-community/whisper-medium-mlx">medium</option>
          <option value="mlx-community/whisper-small-mlx">small (高速)</option>
          <option value="mlx-community/whisper-base-mlx">base</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700 mb-1.5 block">HuggingFace トークン</label>
        <input type="password" x-model="config.hfToken" placeholder="hf_..."
          class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p class="text-xs text-slate-400 mt-1">話者分離に必要。空欄のときは環境変数 HF_TOKEN を使用。</p>
      </div>
    </div>
  </div>

  <!-- ── Main content ─────────────────────────────────────── -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Toolbar -->
    <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 gap-3 shrink-0">

      <!-- Search -->
      <div class="relative flex-1 max-w-xs">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" x-model="searchQuery" placeholder="検索…"
          class="w-full pl-9 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Speaker filter -->
      <div class="relative" x-data="{open:false}" @click.outside="open=false">
        <button @click="open=!open"
          class="flex items-center gap-1.5 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span x-text="speakerFilter || '話者'"></span>
          <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div x-show="open" x-cloak
          class="absolute top-full mt-1 left-0 bg-white border border-slate-200 rounded-xl shadow-lg z-50 py-1 min-w-[160px]">
          <button @click="speakerFilter=''; open=false"
            class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">すべて</button>
          <template x-for="spk in uniqueSpeakers" :key="spk">
            <button @click="speakerFilter=spk; open=false"
              class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 flex items-center gap-2">
              <span class="w-2 h-2 rounded-full" :style="'background:' + speakerColor(spk)"></span>
              <span x-text="spk"></span>
            </button>
          </template>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- Copy all -->
      <button @click="copyAll()"
        :disabled="segments.length === 0"
        :class="segments.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'"
        class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 transition-colors" title="全文コピー">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
      </button>

      <!-- Export dropdown -->
      <div class="relative" x-data="{open:false}" @click.outside="open=false">
        <button @click="open=!open"
          :disabled="segments.length === 0"
          :class="segments.length === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'"
          class="flex items-center gap-1.5 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z"/>
          </svg>
          エクスポート
        </button>
        <div x-show="open" x-cloak
          class="absolute top-full mt-1 right-0 bg-white border border-slate-200 rounded-xl shadow-lg z-50 py-1 min-w-[140px]">
          <button @click="exportAs('txt'); open=false" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">テキスト (.txt)</button>
          <button @click="exportAs('srt'); open=false" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">字幕 (.srt)</button>
          <button @click="exportAs('json'); open=false" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">JSON (.json)</button>
        </div>
      </div>
    </div>

    <!-- Segment list -->
    <div class="flex-1 overflow-y-auto scrollbar-thin px-6 py-4 space-y-3"
      x-ref="segmentList">

      <!-- Empty state -->
      <template x-if="segments.length === 0 && !running">
        <div class="flex flex-col items-center justify-center h-full text-center pb-16">
          <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
            </svg>
          </div>
          <p class="text-slate-400 text-sm">音声ファイルを選んで「文字起こし開始」を押してください</p>
        </div>
      </template>

      <!-- Segment cards -->
      <template x-for="seg in filteredSegments" :key="seg.index">
        <div class="bg-white rounded-xl border border-slate-200 p-4 group hover:border-slate-300 transition-colors">
          <!-- Card header -->
          <div class="flex items-center gap-2 mb-3">
            <!-- Timestamp pill -->
            <span class="text-xs font-mono text-slate-400 bg-slate-50 border border-slate-200 rounded-md px-2 py-0.5"
              x-text="seg.start_fmt"></span>

            <!-- Speaker pill (clickable → rename) -->
            <button @click="openRename(seg)"
              class="flex items-center gap-1.5 text-xs font-semibold rounded-full px-2.5 py-0.5 transition-opacity hover:opacity-80"
              :style="'background:' + seg.color + '22; color:' + seg.color">
              <span class="w-1.5 h-1.5 rounded-full" :style="'background:' + seg.color"></span>
              <span x-text="seg.label"></span>
            </button>

            <div class="flex-1"></div>

            <!-- Per-card actions (hidden until hover) -->
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
              <!-- Edit pencil -->
              <button @click="startEdit(seg)"
                class="w-7 h-7 rounded-md flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" title="編集">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              </button>
              <!-- Copy segment -->
              <button @click="copySegment(seg)"
                class="w-7 h-7 rounded-md flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" title="コピー">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Text body -->
          <template x-if="editingIndex !== seg.index">
            <p class="text-sm text-slate-700 leading-relaxed select-text" x-text="seg.text"></p>
          </template>

          <!-- Inline edit textarea -->
          <template x-if="editingIndex === seg.index">
            <div>
              <textarea
                x-ref="editTextarea"
                x-model="editText"
                :rows="Math.max(3, Math.ceil(editText.length / 60))"
                class="w-full text-sm text-slate-700 leading-relaxed border border-blue-400 rounded-lg px-3 py-2 bg-blue-50 focus:bg-white focus:ring-2 focus:ring-blue-500 transition-colors"
                @keydown.meta.enter="saveEdit(seg)"
                @keydown.escape="cancelEdit()"
              ></textarea>
              <div class="flex items-center gap-2 mt-2">
                <button @click="saveEdit(seg)"
                  class="text-xs font-semibold bg-blue-500 text-white rounded-md px-3 py-1.5 hover:bg-blue-600 transition-colors">
                  保存 <span class="font-normal opacity-70">⌘↵</span>
                </button>
                <button @click="cancelEdit()"
                  class="text-xs text-slate-500 rounded-md px-3 py-1.5 hover:bg-slate-100 transition-colors">
                  キャンセル <span class="opacity-70">Esc</span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Toast -->
    <div x-show="toast" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
      class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm rounded-xl px-4 py-2.5 shadow-lg z-50 pointer-events-none"
      x-text="toast"></div>
  </div><!-- /main -->

  <!-- ── Rename dialog ─────────────────────────────────────── -->
  <div x-show="renameDialog.open" x-cloak
    class="fixed inset-0 bg-black/30 flex items-center justify-center z-50"
    @click.self="renameDialog.open=false">
    <div class="bg-white rounded-2xl shadow-2xl w-80 p-6" @click.stop>
      <h3 class="text-base font-semibold text-slate-800 mb-1">話者名を変更</h3>
      <p class="text-xs text-slate-400 mb-4">変更すると同じ話者ラベルのすべてのセグメントに適用されます</p>

      <!-- Quick chips -->
      <div class="flex flex-wrap gap-2 mb-3">
        <template x-for="name in ['話者A','話者B','話者C','司会','インタビュアー','インタビュイー']" :key="name">
          <button @click="renameDialog.newName = name"
            :class="renameDialog.newName === name ? 'bg-blue-500 text-white border-blue-500' : 'text-slate-600 border-slate-200 hover:border-blue-400'"
            class="text-xs border rounded-full px-3 py-1 transition-colors">
            <span x-text="name"></span>
          </button>
        </template>
      </div>

      <input type="text" x-model="renameDialog.newName"
        placeholder="カスタム名…"
        class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        @keydown.enter="applyRename()" @keydown.escape="renameDialog.open=false" />

      <div class="flex gap-2 justify-end">
        <button @click="renameDialog.open=false"
          class="text-sm text-slate-500 px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors">キャンセル</button>
        <button @click="applyRename()"
          class="text-sm font-semibold bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">変更</button>
      </div>
    </div>
  </div>
</div><!-- /x-data -->

<script>
const COLORS = ["#3B82F6","#10B981","#F59E0B","#EF4444","#8B5CF6","#EC4899","#06B6D4","#84CC16"];
function speakerColorFn(label) {
  let h = 0;
  for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
  return COLORS[h % COLORS.length];
}

function app() {
  return {
    tab: 'transcribe',
    selectedFile: null,
    segments: [],
    running: false,
    progressMsg: '',
    progressPct: 0,
    errorMsg: '',
    searchQuery: '',
    speakerFilter: '',
    editingIndex: null,
    editText: '',
    toast: '',
    _toastTimer: null,
    config: {
      model: 'mlx-community/whisper-large-v3-mlx',
      language: '',
      useDiarization: true,
      hfToken: '',
    },
    renameDialog: { open: false, oldLabel: '', newLabel: '', newName: '' },
    _pollTimer: null,

    init() {
      this.fetchSegments();
    },

    speakerColor(label) { return speakerColorFn(label); },

    get uniqueSpeakers() {
      const s = new Set(this.segments.map(s => s.label));
      return [...s];
    },

    get filteredSegments() {
      return this.segments.filter(seg => {
        if (this.speakerFilter && seg.label !== this.speakerFilter) return false;
        if (this.searchQuery) {
          const q = this.searchQuery.toLowerCase();
          return seg.text.toLowerCase().includes(q) || seg.label.toLowerCase().includes(q);
        }
        return true;
      });
    },

    async selectFile() {
      if (!window.pywebview) {
        this.showToast('PyWebView が見つかりません（ブラウザ直接アクセス不可）');
        return;
      }
      const result = await window.pywebview.api.select_audio_file();
      if (result) {
        this.selectedFile = result;
      }
    },

    handleDrop(event) {
      const file = event.dataTransfer.files[0];
      if (file) {
        this.selectedFile = { name: file.name, path: file.path || file.name };
      }
    },

    async startTranscription() {
      if (!this.selectedFile || this.running) return;
      this.errorMsg = '';
      const res = await fetch('/api/transcribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          file_path: this.selectedFile.path,
          model: this.config.model,
          language: this.config.language || null,
          use_diarization: this.config.useDiarization,
          hf_token: this.config.hfToken || null,
        }),
      });
      const data = await res.json();
      if (data.error) { this.errorMsg = data.error; return; }
      this.running = true;
      this.startPolling();
    },

    startPolling() {
      if (this._pollTimer) clearInterval(this._pollTimer);
      this._pollTimer = setInterval(async () => {
        const res = await fetch('/api/state');
        const s = await res.json();
        this.progressMsg = s.progress_msg;
        this.progressPct = s.progress_pct;
        this.errorMsg = s.error || '';
        if (!s.running) {
          this.running = false;
          clearInterval(this._pollTimer);
          if (s.has_segments) await this.fetchSegments();
        }
      }, 800);
    },

    async fetchSegments() {
      const res = await fetch('/api/segments');
      const data = await res.json();
      this.segments = data;
    },

    startEdit(seg) {
      this.editingIndex = seg.index;
      this.editText = seg.text;
      this.$nextTick(() => {
        const el = this.$refs.editTextarea;
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    },

    async saveEdit(seg) {
      await fetch('/api/edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index: seg.index, text: this.editText }),
      });
      seg.text = this.editText;
      this.editingIndex = null;
      this.showToast('保存しました');
    },

    cancelEdit() {
      this.editingIndex = null;
    },

    openRename(seg) {
      this.renameDialog = { open: true, oldLabel: seg.label, newName: seg.label };
    },

    async applyRename() {
      const { oldLabel, newName } = this.renameDialog;
      if (!newName.trim()) return;
      await fetch('/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_label: oldLabel, new_label: newName.trim() }),
      });
      await this.fetchSegments();
      this.renameDialog.open = false;
      this.showToast('話者名を変更しました');
    },

    async copySegment(seg) {
      const text = `[${seg.start_fmt} ${seg.label}]\n${seg.text}`;
      await navigator.clipboard.writeText(text);
      this.showToast('コピーしました');
    },

    async copyAll() {
      const res = await fetch('/api/copy_text');
      const data = await res.json();
      await navigator.clipboard.writeText(data.text);
      this.showToast('全文をコピーしました');
    },

    async exportAs(fmt) {
      const res = await fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ format: fmt }),
      });
      const data = await res.json();
      if (data.error) { this.showToast('エラー: ' + data.error); return; }

      if (window.pywebview) {
        const base = (this.selectedFile?.name || 'transcript').replace(/\.[^.]+$/, '');
        await window.pywebview.api.save_file(base + '.' + data.ext, data.content, data.ext);
      } else {
        const blob = new Blob([data.content], { type: data.mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (this.selectedFile?.name || 'transcript').replace(/\.[^.]+$/, '') + '.' + data.ext;
        a.click();
      }
      this.showToast('エクスポートしました');
    },

    async saveProject() {
      const res = await fetch('/api/project/save', { method: 'POST' });
      const data = await res.json();
      if (data.error) { this.showToast('エラー: ' + data.error); return; }

      if (window.pywebview) {
        await window.pywebview.api.save_project_file(data.content);
      } else {
        const blob = new Blob([data.content], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'project.transcription.json';
        a.click();
      }
      this.showToast('プロジェクトを保存しました');
    },

    async openProject() {
      let content = null;
      if (window.pywebview) {
        const result = await window.pywebview.api.open_project_file();
        if (!result) return;
        content = result.content;
      } else {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        content = await new Promise(resolve => {
          input.onchange = e => {
            const f = e.target.files[0];
            if (!f) { resolve(null); return; }
            const r = new FileReader();
            r.onload = ev => resolve(ev.target.result);
            r.readAsText(f);
          };
          input.click();
        });
        if (!content) return;
      }

      const res = await fetch('/api/project/load', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content }),
      });
      const data = await res.json();
      if (data.error) { this.showToast('読み込みエラー: ' + data.error); return; }
      await this.fetchSegments();
      this.showToast(`${data.count} 件読み込みました`);
    },

    showToast(msg) {
      this.toast = msg;
      if (this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toast = ''; }, 2500);
    },
  };
}
</script>
</body>
</html>
